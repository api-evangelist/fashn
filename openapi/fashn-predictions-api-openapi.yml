openapi: 3.2.0
info:
  title: FASHN Predictions API
  description: FASHN is an AI-first company specializing in human-centric generative image models tailored for fashion applications. The API provides developers and product teams with access to endpoints for image generation, virtual try-on, model creation, editing, background manipulation, and reframing functionalities.
  version: 1.1.0
  contact:
    name: FASHN
    url: https://fashn.ai
servers:
- url: https://api.fashn.ai
  description: Production server
security:
- ApiKeyAuth: []
tags:
- name: Predictions
  description: AI prediction operations
paths:
  /v1/run:
    post:
      summary: Create a new prediction
      description: 'Submit a prediction request for AI-powered fashion processing. Supports multiple model types including:

        - Try-on max (tryon-max)

        - Virtual try-on v1.6 (tryon-v1.6)

        - Model creation (model-create)

        - Model swap (model-swap)

        - Product to model (product-to-model)

        - Face to model (face-to-model)

        - Background operations (background-remove, background-change)

        - Image reframing (reframe)

        - Image to video (image-to-video)

        - Image editing (edit)

        - Product packshot (packshot)


        All requests use the versioned format with model_name and inputs structure.'
      operationId: createPrediction
      tags:
      - Predictions
      parameters:
      - name: webhook_url
        in: query
        description: Optional webhook URL to receive completion notifications
        required: false
        schema:
          type: string
          format: uri
          example: https://example.com/webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/TryOnMaxRequest'
              - $ref: '#/components/schemas/TryOnRequest'
              - $ref: '#/components/schemas/ProductToModelRequest'
              - $ref: '#/components/schemas/FaceToModelRequest'
              - $ref: '#/components/schemas/ModelCreateRequest'
              - $ref: '#/components/schemas/ModelSwapRequest'
              - $ref: '#/components/schemas/ReframeRequest'
              - $ref: '#/components/schemas/BackgroundChangeRequest'
              - $ref: '#/components/schemas/BackgroundRemoveRequest'
              - $ref: '#/components/schemas/ImageToVideoRequest'
              - $ref: '#/components/schemas/EditRequest'
              - $ref: '#/components/schemas/PackshotRequest'
              discriminator:
                propertyName: model_name
                mapping:
                  tryon-max: '#/components/schemas/TryOnMaxRequest'
                  tryon-v1.6: '#/components/schemas/TryOnRequest'
                  product-to-model: '#/components/schemas/ProductToModelRequest'
                  face-to-model: '#/components/schemas/FaceToModelRequest'
                  model-create: '#/components/schemas/ModelCreateRequest'
                  model-swap: '#/components/schemas/ModelSwapRequest'
                  reframe: '#/components/schemas/ReframeRequest'
                  background-change: '#/components/schemas/BackgroundChangeRequest'
                  background-remove: '#/components/schemas/BackgroundRemoveRequest'
                  image-to-video: '#/components/schemas/ImageToVideoRequest'
                  edit: '#/components/schemas/EditRequest'
                  packshot: '#/components/schemas/PackshotRequest'
            examples:
              tryon-max:
                summary: Virtual try-on max
                value:
                  model_name: tryon-max
                  inputs:
                    product_image: https://example.com/garment.jpg
                    model_image: https://example.com/model.jpg
              try-on-v1.6:
                summary: Virtual try-on v1.6
                value:
                  model_name: tryon-v1.6
                  inputs:
                    model_image: https://example.com/model.jpg
                    garment_image: https://example.com/garment.jpg
              try-on-v1.6-base64:
                summary: Virtual try-on v1.6 base64
                value:
                  model_name: tryon-v1.6
                  inputs:
                    model_image: data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEA...
                    garment_image: data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEA...
              product-to-model:
                summary: Product to Model
                value:
                  model_name: product-to-model
                  inputs:
                    product_image: https://example.com/product.jpg
                    model_image: http://example.com/path/to/person.jpg
                    prompt: professional office setting
                    output_format: png
                    return_base64: false
              model-create:
                summary: Model Create
                value:
                  model_name: model-create
                  inputs:
                    prompt: Full body shot, woman wearing a white t-shirt and dark blue biker shorts
              model-swap:
                summary: Model Swap
                value:
                  model_name: model-swap
                  inputs:
                    model_image: https://example.com/fashion-model.jpg
                    prompt: Asian woman with blue hair
              reframe:
                summary: Reframe
                value:
                  model_name: reframe
                  inputs:
                    image: https://example.com/portrait.jpg
                    aspect_ratio: '16:9'
              background-change:
                summary: Background Change
                value:
                  model_name: background-change
                  inputs:
                    image: https://example.com/portrait.jpg
                    prompt: modern office space with large windows
              face-to-model:
                summary: Face to Model
                value:
                  model_name: face-to-model
                  inputs:
                    face_image: https://example.com/headshot.jpg
                    output_format: jpeg
              background-remove:
                summary: Background Remove
                value:
                  model_name: background-remove
                  inputs:
                    image: https://example.com/portrait.jpg
              image-to-video:
                summary: Image to Video
                value:
                  model_name: image-to-video
                  inputs:
                    image: https://example.com/photo.jpg
                    end_image: https://example.com/end-frame.jpg
                    duration: 5
                    resolution: 720p
              edit:
                summary: Edit
                value:
                  model_name: edit
                  inputs:
                    image: https://example.com/photo.jpg
                    prompt: change the dress to red
              packshot:
                summary: Packshot
                value:
                  model_name: packshot
                  inputs:
                    product_image: https://example.com/product.jpg
                    prompt: clean commercial flat-lay on white background
      responses:
        '200':
          description: Prediction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
              example:
                id: 12345678-1234-5678-9012-123456789012
                error: null
        '400':
          description: Bad request - Invalid request format. Check request structure and required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: BadRequest
                message: Invalid request body
        '401':
          description: Unauthorized - Invalid/missing API key. Verify your API key in the Authorization header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: UnauthorizedAccess
                message: Invalid or inactive API key
        '429':
          description: Too many requests - Implement request throttling, wait for current requests to complete, or purchase more credits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rate-limit:
                  summary: Too many requests
                  value:
                    error: RateLimitExceeded
                    message: Too many requests
                concurrency-limit:
                  summary: Too many concurrent requests
                  value:
                    error: ConcurrencyLimitExceeded
                    message: Too many concurrent requests
                out-of-credits:
                  summary: No API credits remaining
                  value:
                    error: OutOfCredits
                    message: No API credits remaining
        '500':
          description: Internal server error - Server error. Retry after delay, contact support if persistent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: InternalServerError
                message: Server error
  /v1/status/{id}:
    get:
      summary: Get prediction status
      description: 'Poll for the status of a specific prediction using its ID. Use this endpoint to track prediction progress and retrieve results.


        **Status States:**

        - `starting` - Prediction is being initialized

        - `in_queue` - Prediction is waiting to be processed

        - `processing` - Model is actively generating your result

        - `completed` - Generation finished successfully, output available

        - `failed` - Generation failed, check error details


        **Output Availability:**

        - **CDN URLs** (default): Available for 72 hours after completion

        - **Base64 outputs** (when `return_base64: true`): Available for 60 minutes after completion'
      operationId: getPredictionStatus
      tags:
      - Predictions
      parameters:
      - name: id
        in: path
        description: The unique prediction ID returned from the /v1/run endpoint
        required: true
        schema:
          type: string
          example: 123a87r9-4129-4bb3-be18-9c9fb5bd7fc1-u1
      responses:
        '200':
          description: Prediction status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              examples:
                starting:
                  summary: Prediction is starting
                  value:
                    id: 123a87r9-4129-4bb3-be18-9c9fb5bd7fc1-u1
                    status: starting
                    output: null
                    error: null
                in_queue:
                  summary: Prediction is in queue
                  value:
                    id: 123a87r9-4129-4bb3-be18-9c9fb5bd7fc1-u1
                    status: in_queue
                    output: null
                    error: null
                processing:
                  summary: Prediction is processing
                  value:
                    id: 123a87r9-4129-4bb3-be18-9c9fb5bd7fc1-u1
                    status: processing
                    output: null
                    error: null
                completed_urls:
                  summary: Completed prediction with URL outputs
                  value:
                    id: 123a87r9-4129-4bb3-be18-9c9fb5bd7fc1-u1
                    status: completed
                    output:
                    - https://cdn.fashn.ai/123a87r9-4129-4bb3-be18-9c9fb5bd7fc1-u1/output_0.png
                    error: null
                completed_video:
                  summary: Completed prediction with MP4 video outputs
                  value:
                    id: 123a87r9-4129-4bb3-be18-9c9fb5bd7fc1-u1
                    status: completed
                    output:
                    - https://cdn.fashn.ai/123a87r9-4129-4bb3-be18-9c9fb5bd7fc1-u1/output_0.mp4
                    error: null
                completed_base64:
                  summary: Completed prediction with base64 outputs
                  value:
                    id: 123a87r9-4129-4bb3-be18-9c9fb5bd7fc1-u1
                    status: completed
                    output:
                    - data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...
                    error: null
                failed:
                  summary: Failed prediction
                  value:
                    id: 123a87r9-4129-4bb3-be18-9c9fb5bd7fc1-u1
                    status: failed
                    output: null
                    error:
                      name: ImageLoadError
                      message: 'Error loading model image: Invalid URL format'
        '401':
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: UnauthorizedAccess
                message: Invalid or inactive API key
        '404':
          description: Prediction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: NotFound
                message: Prediction not found
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: RateLimitExceeded
                message: Too many requests
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: InternalServerError
                message: Failed to fetch prediction status
components:
  schemas:
    ProductToModelRequest:
      type: object
      required:
      - model_name
      - inputs
      properties:
        model_name:
          type: string
          enum:
          - product-to-model
          description: 'Product to Model endpoint transforms product images into people wearing those products. It supports dual-mode operation: standard product-to-model (generates new person) and try-on mode (adds product to existing person)

            '
        inputs:
          $ref: '#/components/schemas/ProductToModelInputs'
    ReframeRequest:
      type: object
      required:
      - model_name
      - inputs
      properties:
        model_name:
          type: string
          enum:
          - reframe
          description: Image reframing endpoint
        inputs:
          $ref: '#/components/schemas/ReframeInputs'
    ModelCreateRequest:
      type: object
      required:
      - model_name
      - inputs
      properties:
        model_name:
          type: string
          enum:
          - model-create
          description: Model creation endpoint
        inputs:
          $ref: '#/components/schemas/ModelCreateInputs'
    BackgroundRemoveRequest:
      type: object
      required:
      - model_name
      - inputs
      properties:
        model_name:
          type: string
          enum:
          - background-remove
          description: Background removal endpoint
        inputs:
          $ref: '#/components/schemas/BackgroundRemoveInputs'
    ErrorResponse:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          enum:
          - InternalServerError
          - BadRequest
          - NotFound
          - RateLimitExceeded
          - UnauthorizedAccess
          - OutOfCredits
          - ConcurrencyLimitExceeded
          description: Error type identifier
        message:
          type: string
          description: Human-readable error message
          example: Invalid request parameters
    ProductToModelInputs:
      type: object
      required:
      - product_image
      properties:
        product_image:
          type: string
          description: URL or base64 encoded image of the product to be worn. Supports clothing, accessories, shoes, and other wearable fashion items. Base64 images must include the proper prefix (e.g., data:image/jpg;base64,<YOUR_BASE64>)
          example: https://example.com/product.jpg
        model_image:
          type: string
          description: 'URL or base64 encoded image of the person to wear the product. When provided, enables try-on mode. When omitted, generates a new person wearing the product. Base64 images must include the proper prefix (e.g., data:image/jpg;base64,<YOUR_BASE64>)

            '
          example: https://example.com/person.jpg
        image_prompt:
          type: string
          description: 'Optional URL or base64 of an inspiration image to guide pose, environment, and lighting while keeping the final edit product-centric.

            '
          example: https://example.com/inspiration.jpg
        prompt:
          type: string
          description: 'Additional instructions for person appearance (when `model_image` is not provided), styling preferences, or background.


            **Examples:** "man with tattoos", "tucked-in", "open jacket", "rolled-up sleeves", "studio background", "professional office setting"


            **Default:** None

            '
          default: ''
          example: professional office setting
        aspect_ratio:
          type: string
          enum:
          - '21:9'
          - '1:1'
          - '4:3'
          - '3:2'
          - '2:3'
          - '5:4'
          - '4:5'
          - '3:4'
          - '16:9'
          - '9:16'
          description: "Desired aspect ratio for the output image. Only applies when `model_image` is not provided (standard product-to-model mode).\n\nWhen `model_image` is provided (try-on mode), this parameter is ignored and the output will match the `model_image`'s aspect ratio.\n            \n**Default:** product_image's aspect ratio (standard mode only)\n"
        resolution:
          type: string
          enum:
          - 1k
          - 2k
          - 4k
          description: 'Resolution setting for the output image.

            '
          default: 1k
        seed:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: Controls generation randomness on a best-effort basis. Must be between 0 and 2^32-1; exact reproducibility is not guaranteed.
          default: 42
        output_format:
          type: string
          enum:
          - png
          - jpeg
          description: 'Specifies the desired output image format.

            - `png`: Delivers the highest quality image, ideal for use cases such as content creation where quality is paramount.

            - `jpeg`: Provides a faster response with a slightly compressed image, more suitable for real-time applications.

            '
          default: png
        return_base64:
          type: boolean
          description: 'When set to `true`, the API will return the generated image as a base64-encoded string instead of a CDN URL. The base64 string will be prefixed `data:image/png;base64,....`


            This option offers enhanced privacy as user-generated outputs are not stored on our servers when `return_base64` is enabled.

            '
          default: false
        generation_mode:
          type: string
          enum:
          - fast
          - balanced
          - quality
          description: 'Sets the generation quality level. ''quality'' produces the most detailed and realistic output but takes longer to process and costs more credits. ''fast'' prioritizes speed and lower cost.

            '
    TryOnInputs:
      type: object
      required:
      - model_image
      - garment_image
      properties:
        model_image:
          type: string
          description: Primary image of the person on whom the virtual try-on will be performed. Models Studio users can use their saved models by passing `saved:<model_name>`. Base64 images must include the proper prefix (e.g., `data:image/jpg;base64,<YOUR_BASE64>`)
          example: https://example.com/model.jpg
        garment_image:
          type: string
          description: Reference image of the clothing item to be tried on the `model_image`. Base64 images must include the proper prefix (e.g., `data:image/jpg;base64,<YOUR_BASE64>`)
          example: https://example.com/garment.jpg
        category:
          type: string
          enum:
          - auto
          - tops
          - bottoms
          - one-pieces
          description: Use `auto` to enable automatic classification of the garment type. For flat-lay or ghost mannequin images, the system detects the garment type automatically. For on-model images, full-body shots default to a full outfit swap. For focused shots (upper or lower body), the system selects the most likely garment type (tops or bottoms).
          default: auto
        segmentation_free:
          type: boolean
          description: Direct garment fitting without clothing segmentation, enabling bulkier garment try-ons with improved preservation of body shape and skin texture. Set to `false` if original garments are not removed properly.
          default: true
        moderation_level:
          type: string
          enum:
          - conservative
          - permissive
          - none
          description: 'Sets the content moderation level for garment images.

            - `conservative` enforces stricter modesty standards suitable for culturally sensitive contexts. Blocks underwear, swimwear, and revealing outfits.

            - `permissive` allows swimwear, underwear, and revealing garments, while still blocking explicit nudity.

            - `none` disables all content moderation.


            **This technology is designed for ethical virtual try-on applications. Misuse—such as generating inappropriate imagery without consent—violates our Terms of Service. Setting moderation_level: none does not remove your responsibility for ethical and lawful use. Violations may result in service denial.**

            '
          default: permissive
        garment_photo_type:
          type: string
          enum:
          - auto
          - flat-lay
          - model
          description: Specifies the type of garment photo to optimize internal parameters for better performance. `model` is for photos of garments on a model, `flat-lay` is for flat-lay or ghost mannequin images, and `auto` attempts to automatically detect the photo type.
          default: auto
        mode:
          type: string
          enum:
          - performance
          - balanced
          - quality
          description: 'Specifies the mode of operation.

            - `performance` mode is faster but may compromise quality (5 seconds).

            - `balanced` mode is a perfect middle ground between speed and quality (8 seconds).

            - `quality` mode is slower, but delivers the highest quality results (12–17 seconds).

            '
          default: balanced
        seed:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: Controls generation randomness on a best-effort basis. Exact reproducibility is not guaranteed.
          default: 42
        num_samples:
          type: integer
          minimum: 1
          maximum: 4
          description: Number of images to generate per request (1-4).
          default: 1
        output_format:
          type: string
          enum:
          - png
          - jpeg
          description: 'Specifies the desired output image format.

            - `png`: Delivers the highest quality image, ideal for use cases such as content creation where quality is paramount.

            - `jpeg`: Provides a faster response with a slightly compressed image, more suitable for real-time applications like consumer virtual try-on experiences.

            '
          default: png
        return_base64:
          type: boolean
          description: When set to `true`, the API will return the generated image as a base64-encoded string instead of a CDN URL. The base64 string will be prefixed according to the `output_format` (e.g., `data:image/png;base64,...` or `data:image/jpeg;base64,...`). This option offers enhanced privacy as user-generated outputs are not stored on our servers when `return_base64` is enabled.
          default: false
    TryOnRequest:
      type: object
      required:
      - model_name
      - inputs
      properties:
        model_name:
          type: string
          enum:
          - tryon-v1.6
          description: Virtual Try-On v1.6 enables realistic garment visualization using just a single photo of a person and a garment
        inputs:
          $ref: '#/components/schemas/TryOnInputs'
    ImageToVideoInputs:
      type: object
      required:
      - image
      properties:
        image:
          type: string
          description: 'Source image to animate into a short video.


            Base64 images must include the proper prefix (e.g., `data:image/jpg;base64,<YOUR_BASE64>`)

            '
          example: https://example.com/photo.jpg
        prompt:
          type: string
          description: 'Optional motion guidance. Detailed prompting is not recommended because motion is difficult to control precisely. For the best results, leave this field empty and allow the system to plan motion automatically. If you include guidance, keep it short and concrete (e.g., "raising hand to touch face").

            '
          default: ''
        negative_prompt:
          type: string
          description: Optional cues to avoid undesirable motion or framing.
        duration:
          type: integer
          enum:
          - 5
          - 10
          description: Duration of the generated video in seconds.
          default: 5
        resolution:
          type: string
          enum:
          - 480p
          - 720p
          - 1080p
          description: Target video resolution used by the video engine.
          default: 1080p
        end_image:
          type: string
          description: 'Optional image to use as the final frame of the generated video. When provided, the video smoothly transitions from the `image` (start frame) to `end_image` (end frame) over the clip duration.


            Supported with `resolution: "480p"`, `"720p"`, and `"1080p"`.


            Base64 images must include the proper prefix (e.g., `data:image/jpg;base64,<YOUR_BASE64>`).

            '
          example: https://example.com/end-frame.jpg
        seed:
          type: integer
          description: Controls generation randomness on a best-effort basis. Exact reproducibility is not guaranteed.
          default: 42
    TryOnMaxInputs:
      type: object
      required:
      - product_image
      - model_image
      properties:
        product_image:
          type: string
          description: URL or base64 encoded image of the product (garment, accessory, etc.) to place on the model. Base64 images must include the proper prefix (e.g., data:image/jpg;base64,<YOUR_BASE64>)
          example: https://example.com/garment.jpg
        model_image:
          type: string
          description: URL or base64 encoded image of the person to wear the product. The try-on process preserves the model's identity, pose, and styling while seamlessly integrating the product. Base64 images must include the proper prefix (e.g., data:image/jpg;base64,<YOUR_BASE64>)
          example: https://example.com/model.jpg
        prompt:
          type: string
          description: 'Optional instructions to customize the try-on result. Use this to adjust how the product is worn or make minor styling changes.


            **Examples:** "remove scarf", "tuck in shirt", "roll up sleeves", "open jacket"

            '
          default: ''
        resolution:
          type: string
          enum:
          - 1k
          - 2k
          - 4k
          description: 'Resolution setting for the output image.

            '
          default: 1k
        aspect_ratio:
          type: string
          enum:
          - '21:9'
          - '1:1'
          - '4:3'
          - '3:2'
          - '2:3'
          - '5:4'
          - '4:5'
          - '3:4'
          - '16:9'
          - '9:16'
          description: 'Optional aspect ratio for the output image.

            '
        seed:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: Controls generation randomness on a best-effort basis. Exact reproducibility is not guaranteed.
          default: 42
        num_images:
          type: integer
          minimum: 1
          maximum: 4
          description: Number of images to generate per request (1-4).
          default: 1
        output_format:
          type: string
          enum:
          - png
          - jpeg
          description: 'Specifies the desired output image format.

            - `png`: Delivers the highest quality image, ideal for use cases such as content creation where quality is paramount.

            - `jpeg`: Provides a faster response with a slightly compressed image, more suitable for real-time applications.

            '
          default: png
        return_base64:
          type: boolean
          description: When set to `true`, the API will return the generated image as a base64-encoded string instead of a CDN URL. The base64 string will be prefixed according to the `output_format` (e.g., `data:image/png;base64,...` or `data:image/jpeg;base64,...`). This option offers enhanced privacy as user-generated outputs are not stored on our servers when `return_base64` is enabled.
          default: false
        generation_mode:
          type: string
          enum:
          - fast
          - balanced
          - quality
          description: 'Sets the generation quality level. ''quality'' produces the most detailed and realistic output but takes longer to process and costs more credits. ''fast'' prioritizes speed and lower cost.

            '
    ModelSwapRequest:
      type: object
      required:
      - model_name
      - inputs
      properties:
        model_name:
          type: string
          enum:
          - model-swap
          description: Model swap endpoint for transforming model identity while preserving clothing and pose
        inputs:
          $ref: '#/components/schemas/ModelSwapInputs'
    BackgroundChangeInputs:
      type: object
      required:
      - image
      - prompt
      properties:
        image:
          type: string
          description: Source image containing the subject to preserve. The AI will automatically detect and separate the foreground subject from the background. Base64 images must include the proper prefix (e.g., data:image/jpg;base64,<YOUR_BASE64>)
          example: https://example.com/image.jpg
        prompt:
          type: string
