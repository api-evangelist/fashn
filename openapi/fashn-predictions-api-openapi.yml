          - processing
          - completed
          - failed
          - canceled
          - time_out
          description: Current status of the prediction
          example: completed
        output:
          oneOf:
          - type: array
            items:
              type: string
              format: uri
            description: Array of CDN URLs to generated media (images or videos)
            example:
            - https://cdn.fashn.ai/output/image1.jpg
            - https://cdn.fashn.ai/output/image2.jpg
          - type: array
            items:
              type: string
              pattern: ^data:image\/(png|jpeg);base64,
            description: Array of base64-encoded images with proper data URI prefix
            example:
            - data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...
          description: Generated media - for images, outputs are either CDN URLs or base64 (when requested); for videos, outputs are CDN MP4 URLs
          nullable: true
        error:
          oneOf:
          - type: object
            properties:
              name:
                type: string
                enum:
                - ImageLoadError
                - ContentModerationError
                - PoseError
                - InputValidationError
                - PipelineError
                - ThirdPartyError
                - 3rdPartyProviderError
                - InternalServerError
                description: "Error type/category with troubleshooting guidance:\n\n**ImageLoadError** - Unable to load image from provided inputs\n- *Cause*: Pipeline cannot load product image, model image, garment image, or reference image\n- *Solution*: For URLs - ensure public accessibility and correct Content-Type headers. For Base64 - include proper data:image/format;base64 prefix\n\n**ContentModerationError** - Prohibited content detected\n- *Cause*: Content moderation flagged product, garment, or model image. More sensitive when model_image contains an actual person (virtual try-on mode)\n- *Solution*: For try-on models - adjust moderation_level to 'permissive' or 'none' if appropriate. For product-to-model - explicit or inappropriate imagery is prohibited, particularly with real people. For intimate apparel (lingerie/swimwear), use FASHN Virtual Try-On endpoint with full moderation control. Product generation without model_image operates under more permissive policies. Contact support@fashn.ai with prediction ID if content was incorrectly flagged\n\n**PoseError** - Unable to detect body pose (try-on models only)  \n- *Cause*: Body pose not detectable in model or garment image\n- *Solution*: Improve image quality following model photo guidelines\n\n**InputValidationError** - Invalid parameter combination (reframe only)\n- *Cause*: Missing required parameters or invalid values for selected mode\n- *Solution*: Ensure target_aspect_ratio is provided when mode is 'aspect_ratio'. Check aspect ratio values are from supported list\n\n**PipelineError** - Unexpected pipeline execution error\n- *Cause*: Internal processing failure\n- *Solution*: Retry request (no charge for failures). Contact support@fashn.ai with prediction ID if persists\n\n**ThirdPartyError** - Third-party processor failure\n- *Cause*: External service restrictions (content/prompt limitations)\n- *Model-specific solutions*:\n  - *Try-on*: Modify image inputs for captioning restrictions\n  - *Product-to-model*: Try modifying image inputs, most likely caused by content restrictions in image captioning\n  - *Model-swap*: Try different inputs or disable prompt enhancement\n  - *Background-change*: Modify image inputs or background prompt\n  - *Reframe*: Try different image inputs for captioning restrictions\n- Contact support@fashn.ai with prediction ID if persists\n\n**3rdPartyProviderError** - Third-party provider failure (fallback error type)\n- *Cause*: External provider error without specific classification\n- *Solution*: Retry request. Contact support@fashn.ai with prediction ID if persists\n\n**InternalServerError** - General server error (fallback error type)\n- *Cause*: Unexpected server-side failure\n- *Solution*: Retry request. Contact support@fashn.ai with prediction ID if persists\n"
                example: ImageLoadError
              message:
                type: string
                description: Detailed error message explaining the specific failure
                example: 'Error loading model image: Invalid URL format'
            required:
            - name
            - message
            description: Structured error object with name and message fields
          description: Error information if prediction failed, null otherwise
          nullable: true
